name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Verify GitHub Pages base path
        run: |
          grep -q '/shahine-portofolio/assets/' dist/index.html
          test ! -e dist/shahine-portofolio
      - name: Chromium runtime smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          SITE_URL='http://127.0.0.1:4173/shahine-portofolio/'
          for i in {1..20}; do
            if curl -fsS "$SITE_URL" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "$SITE_URL" >/dev/null

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          run_smoke() {
            LABEL="$1"
            SIZE="$2"

            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --enable-logging=stderr \
              --log-level=0 \
              --window-size="$SIZE" \
              --dump-dom \
              "$SITE_URL" \
              > "/tmp/${LABEL}.html" \
              2> "/tmp/${LABEL}.log"

            grep -q 'SHAHINE' "/tmp/${LABEL}.html"
            grep -q 'Cuts that hit before' "/tmp/${LABEL}.html"
            grep -q 'The edit is the identity' "/tmp/${LABEL}.html"
            grep -q 'Every cut has a reason' "/tmp/${LABEL}.html"
            grep -q 'Before the first cut' "/tmp/${LABEL}.html"
            grep -q 'cdn.sceneai.art' "/tmp/${LABEL}.html"

            if grep -Eiq 'Uncaught|TypeError|ReferenceError|SyntaxError' "/tmp/${LABEL}.log"; then
              cat "/tmp/${LABEL}.log"
              exit 1
            fi
          }

          run_smoke desktop '1440,1000'
          run_smoke mobile '390,844'
