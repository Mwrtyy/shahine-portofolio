name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Chromium runtime smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          run_smoke() {
            LABEL="$1"
            SIZE="$2"

            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --enable-unsafe-swiftshader \
              --use-angle=swiftshader \
              --enable-logging=stderr \
              --log-level=0 \
              --window-size="$SIZE" \
              --dump-dom \
              http://127.0.0.1:4173/ \
              > "/tmp/${LABEL}.html" \
              2> "/tmp/${LABEL}.log"

            grep -q 'SHAHINE' "/tmp/${LABEL}.html"
            grep -q 'device-stage' "/tmp/${LABEL}.html"

            if grep -Eiq 'Uncaught|TypeError|ReferenceError|SyntaxError' "/tmp/${LABEL}.log"; then
              cat "/tmp/${LABEL}.log"
              exit 1
            fi
          }

          run_smoke desktop '1440,1000'
          run_smoke mobile '390,844'
